<title>The Long Score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a night sky you travel through sideways. Time runs left to right, three lanes (stage, orchestra, keyboard).
   The palette and the music both follow the year at the center of the screen. */
:root{
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Crimson Pro","Iowan Old Style",Georgia,serif;
  --label:"Jost","Helvetica Neue",Arial,sans-serif;
  --bg:#20130e;--fg:#f2e8d2;--muted:#bfae92;--accent:#d6a94c;--ink:#20130e;
  --gutter:clamp(16px,4vw,48px);
  color-scheme:dark;
}
.e-baroque{--bg:#20130e;--fg:#f2e8d2;--muted:#bfae92;--accent:#d6a94c;--ink:#20130e}
.e-classical{--bg:#243846;--fg:#eef1ec;--muted:#a9bac4;--accent:#ead9a2;--ink:#17252f}
.e-romantic{--bg:#1a1430;--fg:#efe9f3;--muted:#b0a6c6;--accent:#ee8f78;--ink:#1a1430}
.stage,.page,.bar,.ov,.gate,.game,.credits{--line:color-mix(in srgb,var(--accent) 36%,transparent);--card:color-mix(in srgb,var(--bg) 84%,#fff);--bg2:color-mix(in srgb,var(--bg) 88%,#000)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#150d0a;color:var(--fg);font-family:var(--body);font-size:1.12rem;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.02;margin:0;text-wrap:balance}
.label{font-family:var(--label);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:var(--gutter)}
.chip{display:inline-block;font-family:var(--label);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--line);color:var(--muted);border-radius:99px}
.chip.hot{border-color:var(--accent);color:var(--accent)}
.btn,.play{display:inline-flex;align-items:center;gap:9px;font-family:var(--label);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:11px 16px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:2px;white-space:nowrap}
.btn:hover,.play:hover{background:var(--accent);color:var(--ink)}
.btn.solid{background:var(--accent);color:var(--ink)}
.btn.solid:hover{filter:brightness(1.1)}
.play svg{width:11px;height:11px;fill:currentColor}

/* ---------- top bar ---------- */
.bar{position:fixed;top:0;left:0;right:0;z-index:60;padding:calc(10px + env(safe-area-inset-top,0px)) var(--gutter) 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--fg);background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 88%,transparent),transparent)}
.bar .brand{font-family:var(--display);font-size:1.4rem;font-style:italic;font-weight:600;text-decoration:none;white-space:nowrap}
.bar .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tbtn{font-family:var(--label);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:99px;text-decoration:none;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tbtn:hover,.tbtn.on{border-color:var(--accent);color:var(--accent)}
.tbtn svg{width:13px;height:13px;fill:currentColor}

/* ---------- entry gate ---------- */
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:var(--gutter);background:radial-gradient(900px 500px at 50% 30%,rgba(214,169,76,.18),transparent 70%),#150d0a;color:#f2e8d2;text-align:center;--accent:#d6a94c;--bg:#20130e;--muted:#bfae92;--ink:#20130e;--fg:#f2e8d2}
.gate[hidden]{display:none}
.gate h1{font-size:clamp(3.8rem,15vw,10rem);font-style:italic;letter-spacing:-.02em;line-height:.9}
.gate .kick{font-family:var(--label);letter-spacing:.34em;text-transform:uppercase;font-size:.78rem;color:var(--accent);margin-bottom:1.2em;display:block}
.gate p{max-width:30em;margin:1.4rem auto 0;color:var(--muted);font-size:1.25rem}
.gate .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:2rem}
.gate .btn{padding:15px 24px;font-size:.78rem}
.gate .small{font-size:.9rem;margin-top:1.4rem}
.staffline{position:absolute;left:0;right:0;top:50%;height:60px;transform:translateY(-50%);opacity:.14;background:repeating-linear-gradient(180deg,#d6a94c 0 1px,transparent 1px 12px);pointer-events:none}

/* ---------- constellation ---------- */
.stage{position:fixed;inset:0;overflow:hidden;background:var(--bg);color:var(--fg);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.stage.drag{cursor:grabbing}
.bgs{position:absolute;inset:-4%;pointer-events:none}
.bgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(6px) saturate(.85);opacity:0;will-change:opacity}
.scrim{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 0,color-mix(in srgb,var(--bg) 55%,transparent) 55%,color-mix(in srgb,var(--bg) 92%,transparent) 100%)}
.lane-labels{position:absolute;left:0;top:0;bottom:0;width:0;pointer-events:none;z-index:3}
.lane-labels span{position:absolute;left:10px;transform:translateY(-50%);font-family:var(--label);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);opacity:.8;writing-mode:vertical-rl;rotate:180deg}
.world{position:absolute;left:0;top:0;height:100%;will-change:transform}
.world svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--accent);stroke-width:1;opacity:.16;transition:opacity .4s,stroke-width .4s}
.edge.hot{opacity:.95;stroke-width:2}
.era-word{position:absolute;top:50%;transform:translate(-50%,-50%);font-family:var(--display);font-style:italic;font-size:clamp(5rem,16vw,15rem);color:var(--fg);opacity:.07;white-space:nowrap;pointer-events:none;letter-spacing:-.02em}
.era-line{position:absolute;top:96px;bottom:250px;width:1px;background:repeating-linear-gradient(180deg,var(--line) 0 4px,transparent 4px 10px);pointer-events:none}
.era-line span{position:absolute;top:-4px;left:8px;font-family:var(--label);font-size:.62rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.life{position:absolute;height:1px;background:var(--accent);opacity:.22;pointer-events:none}
.life::before,.life::after{content:"";position:absolute;top:-3px;width:1px;height:7px;background:var(--accent)}
.life::before{left:0}.life::after{right:0}
.ruler{position:absolute;height:0;pointer-events:none}
.ruler i{position:absolute;font-style:normal;font-family:var(--label);font-size:.6rem;letter-spacing:.12em;color:var(--muted);opacity:.7;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.node{position:absolute;width:0;height:0;padding:0;border:0;background:none;color:inherit;z-index:2}
.node .disc{position:absolute;left:calc(var(--nd) / -2);top:calc(var(--nd) / -2);width:var(--nd);height:var(--nd);border-radius:50%;transform:scale(var(--s,1));transition:box-shadow .3s;box-shadow:0 0 0 2px var(--line),0 10px 30px -10px rgba(0,0,0,.7)}
.node .disc img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:50%;filter:grayscale(.45) contrast(1.05) sepia(.25);transition:filter .4s}
.node.focus .disc{box-shadow:0 0 0 3px var(--accent),0 0 40px 6px color-mix(in srgb,var(--accent) 45%,transparent)}
.node.focus .disc img{filter:none}
.node .ring{position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--accent);opacity:0;transform:scale(calc(1 + var(--lvl,0)*.55));pointer-events:none}
.node.focus .ring{opacity:.7}
.node b{position:absolute;left:0;top:calc(var(--nd) / 2 + 12px);transform:translateX(-50%) scale(var(--ls,1));transform-origin:top center;font-family:var(--display);font-size:1.15rem;font-weight:600;font-style:italic;white-space:nowrap;text-shadow:0 1px 8px var(--bg),0 0 14px var(--bg)}
.node b small{display:block;font-family:var(--label);font-style:normal;font-weight:400;font-size:.56rem;letter-spacing:.16em;color:var(--muted);text-align:center;text-transform:uppercase}

/* HUD */
.hud{position:absolute;left:var(--gutter);right:var(--gutter);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:5;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);max-width:960px;margin-inline:auto;cursor:default}
.hud-l{display:grid;grid-template-columns:78px minmax(0,1fr);gap:16px;padding:14px 18px;align-items:center}
.hud .hp{width:78px;height:78px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--accent)}
.hud h2{font-size:clamp(1.7rem,3vw,2.3rem);font-style:italic;margin-top:2px}
.hud .tg{margin:2px 0 0;color:var(--muted);font-size:.98rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hud .np{margin:6px 0 0;font-family:var(--label);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hud .np .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.hud .np .eq i{width:2px;background:var(--accent);height:30%;animation:eq 1s infinite ease-in-out}
.hud .np .eq i:nth-child(2){animation-delay:.2s}.hud .np .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.muted-state .eq i{animation:none}
.hud-r{display:grid;grid-template-columns:minmax(0,1fr) auto;border-left:1px solid var(--line)}
.hud-r figure{margin:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 12px;align-items:center}
.hud-r img{width:96px;height:72px;object-fit:cover}
.hud-r figcaption{font-size:.86rem;line-height:1.3;color:var(--muted)}
.hud-r figcaption b{display:block;font-family:var(--display);font-style:italic;font-weight:500;font-size:1.05rem;color:var(--fg)}
.hud-btns{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:10px 14px 10px 0}
.hud-btns .btn{padding:9px 12px;font-size:.62rem}

/* scrubber */
.scrub{position:absolute;left:var(--gutter);right:var(--gutter);bottom:calc(18px + env(safe-area-inset-bottom,0px));height:38px;z-index:6;max-width:960px;margin-inline:auto;cursor:pointer}
.scrub .track{position:absolute;left:0;right:0;top:19px;height:3px;display:flex}
.scrub .seg{height:100%}
.scrub .tick{position:absolute;top:8px;width:22px;height:22px;margin-left:-11px;border-radius:50%;border:1px solid var(--line);overflow:hidden;background:var(--bg2);padding:0;transition:transform .2s,border-color .2s}
.scrub .tick img{width:100%;height:100%;object-fit:cover;object-position:top;opacity:.85}
.scrub .tick:hover,.scrub .tick.on{transform:scale(1.5);border-color:var(--accent);z-index:3}
.scrub .head{position:absolute;top:0;width:2px;height:38px;background:var(--accent);margin-left:-1px;pointer-events:none;box-shadow:0 0 12px var(--accent)}
.scrub .head span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-family:var(--label);font-size:.66rem;letter-spacing:.12em;color:var(--accent);font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--bg) 80%,transparent);padding:0 6px}
.hint{position:absolute;left:50%;top:104px;transform:translateX(-50%);z-index:4;font-family:var(--label);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);background:color-mix(in srgb,var(--bg) 78%,transparent);padding:8px 16px;border:1px solid var(--line);border-radius:99px;transition:opacity .8s;white-space:nowrap;pointer-events:none}
.hint.gone{opacity:0}

/* ---------- full-page overlays: composer page, game, credits ---------- */
.ov{position:fixed;inset:0;z-index:55;overflow-y:auto;background:var(--bg);color:var(--fg);-webkit-overflow-scrolling:touch}
.ov[hidden]{display:none}
.page{padding-top:calc(76px + env(safe-area-inset-top,0px))}
.p-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(24px,5vw,72px);align-items:center;padding-block:40px 52px}
.p-portrait{justify-self:center;width:min(100%,360px)}
.p-portrait img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:180px 180px 6px 6px;border:1px solid var(--line);padding:10px;background:var(--card)}
.p-head h1{font-size:clamp(3.2rem,9vw,7rem);font-style:italic;letter-spacing:-.02em;margin-top:.15em}
.p-head .dates{font-family:var(--label);letter-spacing:.2em;font-size:.8rem;text-transform:uppercase;color:var(--accent);margin-top:14px}
.p-head .tagl{font-size:clamp(1.3rem,2.6vw,1.8rem);font-style:italic;margin:18px 0 0;max-width:24em;line-height:1.3}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.p-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(28px,5vw,72px);padding-bottom:70px}
.p-main section{margin-bottom:42px}
.p-main h2,.works h2,.span h2{font-size:clamp(1.8rem,3.4vw,2.5rem);font-style:italic;margin-bottom:14px}
.p-main p{margin:0 0 1em;max-width:36em}
.p-main .style{font-size:1.2rem;border-left:2px solid var(--accent);padding-left:20px}
.listen ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.listen li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;max-width:36em}
.listen li i{display:block;width:14px;height:10px;border-radius:50%;background:var(--accent);transform:rotate(-22deg);margin-top:.62em}
.fact,.startbox{background:var(--bg2);border:1px solid var(--line);padding:20px 22px;max-width:36em}
.startbox{border-left:3px solid var(--accent)}
.startbox p,.fact p{margin:6px 0 14px}
.conn{display:grid;gap:12px;max-width:38em}
.conn a{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;padding:10px 12px;border:1px solid var(--line);background:var(--bg2)}
.conn a:hover{border-color:var(--accent)}
.conn img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:top}
.conn b{font-family:var(--display);font-size:1.2rem;font-style:italic;font-weight:600}
.conn span{display:block;font-size:.95rem;line-height:1.4;color:var(--muted)}
.art-panel{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));align-self:start}
.art-panel .mat{padding:clamp(10px,1.4vw,16px);background:var(--card);border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.art-panel img{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain}
.art-panel h3{font-size:1.7rem;font-style:italic;margin-top:16px}
.art-panel .cap{font-size:.95rem;color:var(--muted);line-height:1.45;margin:6px 0 0}
.art-panel .why{margin:14px 0 0;font-size:1.05rem}
.art-panel .src{font-family:var(--label);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;margin-top:12px;display:block;color:var(--accent)}
.works{padding-top:52px;border-top:1px solid var(--line);padding-bottom:60px}
.work{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);scroll-margin-top:100px}
.work.pick{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent);padding-inline:14px;margin-inline:-14px;border-left:3px solid var(--accent)}
.work h3{font-size:1.45rem}
.work .sub{color:var(--muted);font-size:.98rem;margin:2px 0 0}
.work .tags{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.span{padding-bottom:70px}
.span-scroll{overflow-x:auto}
.span svg{min-width:680px;width:100%;height:auto;display:block}
.span text{font-family:var(--label);font-size:10.5px;fill:var(--muted);letter-spacing:.05em}
.span text.me{fill:var(--fg);font-weight:600}
.span .axis{stroke:var(--line)}
.span .bar-o{fill:var(--line)}
.span .bar-me{fill:var(--accent)}
.pn{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.pn a{padding:26px var(--gutter);text-decoration:none;display:grid;gap:4px}
.pn a:hover{background:var(--bg2)}
.pn a+a{text-align:right;border-left:1px solid var(--line)}
.pn b{font-family:var(--display);font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:500;font-style:italic}

/* game */
.game{max-width:900px;margin-inline:auto;padding:calc(90px + env(safe-area-inset-top,0px)) var(--gutter) 70px}
.game h1{font-size:clamp(2.6rem,7vw,5rem);font-style:italic}
.game .lede{color:var(--muted);max-width:32em;margin:10px 0 0}
.g-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:26px}
.g-art{margin:18px 0 0;background:var(--card);border:1px solid var(--line);padding:clamp(8px,1.4vw,14px)}
.g-art img{display:block;width:100%;max-height:52vh;object-fit:contain}
.g-q{margin:22px 0 10px;font-family:var(--display);font-size:1.6rem;font-style:italic}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:2px;color:var(--fg)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:top}
.opt b{font-family:var(--display);font-size:1.3rem;font-style:italic;font-weight:600;line-height:1.1}
.opt small{display:block;font-family:var(--label);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.opt.right{border-color:#7fd19b;background:color-mix(in srgb,#7fd19b 16%,var(--bg2))}
.opt.wrong{border-color:#e8806d;background:color-mix(in srgb,#e8806d 14%,var(--bg2))}
.opt.dim{opacity:.35}
.opt:disabled{cursor:default}
.hear{width:36px;height:36px;border-radius:50%;border:1px solid var(--accent);background:transparent;color:var(--accent);display:grid;place-items:center;padding:0}
.hear:hover{background:var(--accent);color:var(--ink)}
.hear svg{width:12px;height:12px;fill:currentColor}
.reveal{margin-top:20px;padding:18px 20px;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent)}
.reveal p{margin:6px 0 14px}
.reveal .row{display:flex;gap:10px;flex-wrap:wrap}
.score{font-family:var(--display);font-size:clamp(3.4rem,10vw,6.5rem);font-style:italic;color:var(--accent);line-height:1}
.credits{max-width:860px;margin-inline:auto;padding:calc(96px + env(safe-area-inset-top,0px)) var(--gutter) 70px}
.credits h1{font-size:clamp(2.6rem,7vw,4.6rem);font-style:italic;margin-bottom:18px}
.credits li{margin-bottom:12px;list-style:none}
.credits ul{padding:0;margin:20px 0 28px}
.credits li span{color:var(--muted);font-size:.95rem}
.credits a{color:var(--accent)}

@media (max-width:860px){
  .p-head,.p-grid{grid-template-columns:minmax(0,1fr)}
  .art-panel{position:static}
  .work{grid-template-columns:minmax(0,1fr)}
  .play{justify-self:start}
  .hud{grid-template-columns:minmax(0,1fr)}
  .hud-r{border-left:0;border-top:1px solid var(--line)}
  .hud-r figure{grid-template-columns:70px minmax(0,1fr)}
  .hud-r img{width:70px;height:52px}
  .hud-r figcaption{font-size:.8rem}
}
@media (max-width:560px){
  .opts{grid-template-columns:minmax(0,1fr)}
  .hud-l{grid-template-columns:56px minmax(0,1fr);padding:10px 12px;gap:12px}
  .hud .hp{width:56px;height:56px}
  .hud .tg{-webkit-line-clamp:1}
  .tbtn .t{display:none}
  .hint{white-space:normal;text-align:center;width:max-content;max-width:86vw}
}
@media (max-height:640px){.hud-r{display:none}.hud{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="gate" id="gate">

  <div style="position:relative">

<header class="bar e-baroque" id="bar"></header>
<main id="app"></main>
<section class="ov" id="ov" hidden></section>

<script>
const DATA = /*DATA*/null;
/*CONTENT*/

/* ================= data ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const yr=d=>d.slice(0,4);
const bySlug={};
ORDER.forEach(slug=>{
  const nm=OPUS_NAME[slug]||slug[0].toUpperCase()+slug.slice(1);
  const c=DATA.composers.find(x=>x.name.toLowerCase()===nm.toLowerCase());
  bySlug[slug]=Object.assign({slug},c,C[slug],LAYOUT[slug],{clip:CLIPS[slug]});
});
const COMP=ORDER.map(s=>bySlug[s]);
const eraOf=k=>ERAS.find(e=>e.key===k);
const short=t=>t.replace(/,?\s*(op|BWV|RV|HWV|K|S|D|Hob|WWV|B)\.[^",]*/,"").replace(/\s+/g," ").trim();
const yt=(c,w)=>"https://www.youtube.com/results?search_query="+encodeURIComponent(c.complete_name+" "+short(w.title));
const playIcon='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg>';
const spk=on=>on?'<svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11 5.5a3.5 3.5 0 010 5M12.8 3.6a6.2 6.2 0 010 8.8" stroke="currentColor" fill="none" stroke-width="1.3"/></svg>':'<svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11.5 6l3 4m0-4l-3 4" stroke="currentColor" fill="none" stroke-width="1.3"/></svg>';

/* ================= audio engine (Web Audio, crossfading loops) ================= */
const A={ctx:null,master:null,an:null,on:false,muted:false,bufs:new Map(),loading:new Set(),voices:new Map(),failed:new Set(),buf:new Uint8Array(256),lvl:0,
  init(){
    if(this.ctx) return true;
    try{
      const AC=window.AudioContext||window.webkitAudioContext; this.ctx=new AC();
      this.master=this.ctx.createGain(); this.an=this.ctx.createAnalyser(); this.an.fftSize=256;
      this.master.connect(this.an); this.an.connect(this.ctx.destination);
      this.on=true; return true;
    }catch(e){ this.on=false; return false; }
  },
  resume(){ if(this.ctx&&this.ctx.state!=="running") this.ctx.resume().catch(()=>{}); },
  setMuted(m){ this.muted=m; if(this.ctx) this.master.gain.setTargetAtTime(m?0:1,this.ctx.currentTime,.15); },
  load(slug){
    if(!this.ctx||this.bufs.has(slug)||this.loading.has(slug)||this.failed.has(slug)) return;
    this.loading.add(slug);
    fetch("audio/"+slug+".mp3").then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); })
      .then(b=>new Promise((ok,no)=>this.ctx.decodeAudioData(b,ok,no)))
      .then(buf=>{ this.bufs.set(slug,buf); this.loading.delete(slug); this.evict(); })
      .catch(()=>{ this.loading.delete(slug); this.failed.add(slug); });
  },
  evict(){
    if(this.bufs.size<=7) return;
    for(const k of this.bufs.keys()){ if(this.bufs.size<=7) break; if(!this.voices.has(k)) this.bufs.delete(k); }
  },
  drive(w){ // w: {slug: 0..1}
    if(!this.ctx||!this.on) return;
    const now=this.ctx.currentTime;
    for(const [slug,g] of Object.entries(w)){
      if(g>0.04){
        this.load(slug);
        if(!this.voices.has(slug) && this.bufs.has(slug) && this.ctx.state==="running"){
          const src=this.ctx.createBufferSource(); src.buffer=this.bufs.get(slug); src.loop=true;
          const gn=this.ctx.createGain(); gn.gain.value=0; src.connect(gn); gn.connect(this.master); src.start(0);
          this.voices.set(slug,{src,gn,idle:0});
        }
      }
    }
    for(const [slug,v] of this.voices){
      const g=w[slug]||0;
      v.gn.gain.setTargetAtTime(g*.9,now,.45);
      if(g<=0.02){ v.idle+=1; if(v.idle>40){ try{v.src.stop(now+.1)}catch(e){} this.voices.delete(slug);} } else v.idle=0;
    }
  },
  level(){
    if(!this.ctx||!this.on) return 0;
    this.an.getByteTimeDomainData(this.buf);
    let s=0; for(let i=0;i<this.buf.length;i++){const x=(this.buf[i]-128)/128;s+=x*x}
    return Math.min(1,Math.sqrt(s/this.buf.length)*3.2);
  }
};
function weightsAt(t){
  const sig=9, w={}; let sum=0;
  COMP.forEach(c=>{const d=(t-c.peak)/sig; const x=Math.exp(-d*d); w[c.slug]=x; sum+=x*x;});
  const n=Math.sqrt(sum)||1; for(const k in w) w[k]=w[k]/n; return w;
}

/* ================= palette from year ================= */
const PAL={baroque:[32,19,14,242,232,210,191,174,146,214,169,76],classical:[36,56,70,238,241,236,169,186,196,234,217,162],romantic:[26,20,48,239,233,243,176,166,198,238,143,120]};
const sstep=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)};
function eraBlend(t){ const b=sstep(1738,1762,t), r=sstep(1800,1824,t); return {baroque:1-b,classical:b*(1-r),romantic:r}; }
function palFor(bl){
  const out=new Array(12).fill(0);
  for(const k in bl) PAL[k].forEach((v,i)=>out[i]+=v*bl[k]);
  const rgb=i=>`rgb(${out[i]|0},${out[i+1]|0},${out[i+2]|0})`;
  return {"--bg":rgb(0),"--fg":rgb(3),"--muted":rgb(6),"--accent":rgb(9),"--ink":rgb(0)};
}
function eraAt(t){ return t<1750?"baroque":t<1812?"classical":"romantic"; }

/* ================= constellation ================= */
const YMIN=1690,YMAX=1915;
let ppy=16,ND=92,VW=innerWidth,VH=innerHeight;
let T=1722,TT=1722,tour=false,focus=null,lastFocus="",dragging=false,view="stage";
let stageEl,worldEl,nodeEls={},lastPal="";
const X=y=>(y-YMIN)*ppy+VW/2;
function laneY(c){
  const top=96, bottom=VH-(VW<860?330:290), h=Math.max(bottom-top,180);
  return top+h*[.12,.5,.88][c.lane]+c.dy*(ND/92);
}
function buildStage(){
  VW=innerWidth;VH=innerHeight; ppy=VW<700?11:16; ND=VW<700?66:92;
  { const hh=VH-(VW<860?330:290)-96; ND=Math.max(44,Math.min(ND,Math.floor(hh*.36))); }
  const worldW=(YMAX-YMIN)*ppy+VW;
  const bgs=ERAS.map(e=>`<img data-e="${e.key}" src="${DATA.eras[e.art].img}" alt="">`).join("");
  let w=`<svg width="${worldW}" height="${VH}" aria-hidden="true">`;
  EDGES.forEach(([a,b])=>{
    const A1=bySlug[a],B1=bySlug[b], x1=X(A1.peak),y1=laneY(A1),x2=X(B1.peak),y2=laneY(B1), dx=(x2-x1)*.5;
    w+=`<path class="edge" data-a="${a}" data-b="${b}" d="M${x1} ${y1} C${x1+dx} ${y1-30} ${x2-dx} ${y2+30} ${x2} ${y2}"/>`;
  });
  w+=`</svg>`;
  [["baroque",1690,1750],["classical",1750,1812],["romantic",1812,1915]].forEach(([k,a,b])=>{
    w+=`<div class="era-word" style="left:${X((a+b)/2)}px">${k}</div>`;
  });
  [[1750,"Classical begins, c. 1750"],[1812,"Romantic begins, c. 1815"]].forEach(([y,l])=>{
    w+=`<div class="era-line" style="left:${X(y)}px"><span>${l}</span></div>`;
  });
  w+=`<div class="ruler" style="top:70px">`;
  for(let y=1700;y<=1910;y+=10) w+=`<i style="left:${X(y)}px">${y}</i>`;
  w+=`</div>`;
  COMP.forEach(c=>{
    w+=`<div class="life" style="left:${X(+yr(c.birth))}px;width:${(+yr(c.death)-+yr(c.birth))*ppy}px;top:${laneY(c)}px"></div>`;
  });
  COMP.forEach(c=>{
    w+=`<button class="node" data-slug="${c.slug}" style="left:${X(c.peak)}px;top:${laneY(c)}px;--nd:${ND}px" aria-label="${esc(c.complete_name)}, ${c.birth.slice(0,4)} to ${c.death.slice(0,4)}">
      <span class="disc"><img src="${c.portrait_data}" alt=""><i class="ring"></i></span>
      <b>${esc(c.name)}<small>${yr(c.birth)}&ndash;${yr(c.death)}</small></b></button>`;
  });
  const labs=LANES.map((l,i)=>`<span style="top:${laneY({lane:i,dy:0})}px">${l}</span>`).join("");
  $("#app").innerHTML=`<div class="stage" id="stage"><div class="bgs">${bgs}</div><div class="scrim"></div><div class="lane-labels">${labs}</div>
    <div class="world" id="world" style="width:${worldW}px">${w}</div>
    <div class="hint" id="hint">Drag, scroll or press &larr; &rarr; to travel through time</div>
    <div class="hud" id="hud"></div>
    <div class="scrub" id="scrub"></div></div>`;
  stageEl=$("#stage");worldEl=$("#world");
  nodeEls={}; stageEl.querySelectorAll(".node").forEach(n=>nodeEls[n.dataset.slug]=n);
  buildScrub(); lastFocus=""; lastPal="";
  bindStage();
}
function buildScrub(){
  const p=y=>(y-YMIN)/(YMAX-YMIN)*100;
  const sc=$("#scrub");
  const segs=[["baroque",YMIN,1750],["classical",1750,1812],["romantic",1812,YMAX]].map(([k,a,b])=>`<div class="seg" style="width:${p(b)-p(a)}%;background:${k==="baroque"?"#d6a94c":k==="classical"?"#ead9a2":"#ee8f78"};opacity:.7"></div>`).join("");
  sc.innerHTML=`<div class="track">${segs}</div>`+COMP.map(c=>`<button class="tick" data-slug="${c.slug}" style="left:${p(c.peak)}%" aria-label="Go to ${esc(c.name)}"><img src="${c.portrait_data}" alt=""></button>`).join("")+`<div class="head" id="head"><span id="headY">1722</span></div>`;
}
let drag=null;
function bindStage(){
  const st=stageEl;
  st.addEventListener("wheel",e=>{ e.preventDefault(); tour=false; syncTour(); TT=clampT(TT+(e.deltaY+e.deltaX)*1.1/ppy); hideHint(); },{passive:false});
  st.addEventListener("pointerdown",e=>{
    if(e.target.closest(".hud,.scrub")) return;
    drag={x:e.clientX,t:TT,moved:0,lx:e.clientX,lt:performance.now(),v:0,node:e.target.closest(".node")};
    tour=false; syncTour();
  });
  addEventListener("pointermove",e=>{
    if(!drag) return;
    const dx=e.clientX-drag.x; drag.moved=Math.max(drag.moved,Math.abs(dx));
    if(drag.moved>5){ st.classList.add("drag"); TT=clampT(drag.t-dx/ppy); hideHint();
      const now=performance.now(), dt=now-drag.lt; if(dt>0){ drag.v=(e.clientX-drag.lx)/dt; } drag.lx=e.clientX; drag.lt=now; }
  });
  addEventListener("pointerup",()=>{
    if(!drag) return;
    const d=drag; drag=null; st.classList.remove("drag");
    if(d.moved>5){ TT=clampT(TT-d.v*220/ppy); }
    else if(d.node){ const slug=d.node.dataset.slug; if(focus===slug && Math.abs(T-bySlug[slug].peak)<3) location.hash=slug; else TT=bySlug[slug].peak; }
  });
  $("#scrub").addEventListener("pointerdown",e=>{
    const tick=e.target.closest(".tick"); tour=false; syncTour();
    if(tick){ TT=bySlug[tick.dataset.slug].peak; return; }
    const r=$("#scrub").getBoundingClientRect();
    const mv=ev=>{ TT=clampT(YMIN+(ev.clientX-r.left)/r.width*(YMAX-YMIN)); };
    mv(e); const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up)};
    addEventListener("pointermove",mv); addEventListener("pointerup",up);
  });
}
const clampT=t=>Math.max(1700,Math.min(1912,t));
function hideHint(){ const h=$("#hint"); if(h) h.classList.add("gone"); }
function setHUD(c){
  const e=eraOf(c.era), a=c.art;
  $("#hud").innerHTML=`<div class="hud-l"><img class="hp" src="${c.portrait_data}" alt="">
      <div><span class="label">${e.name} &middot; ${esc(c.place)}</span><h2>${esc(c.complete_name)}</h2><p class="tg">${esc(c.tag)}</p>
      <p class="np"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span>${esc(c.clip.piece)}</span></p></div></div>
    <div class="hud-r"><figure><img src="${a.img}" alt="${esc(a.title)}"><figcaption><b>${esc(a.title)}</b>${esc(a.artist_title)}, ${esc(a.date_display)}</figcaption></figure>
      <div class="hud-btns"><a class="btn solid" href="#${c.slug}">Open page</a></div></div>`;
}
let lastFrame=performance.now(), audioTick=0, lastT=null;
function frame(now){
  const dt=Math.min(.05,(now-lastFrame)/1000); lastFrame=now;
  if(view==="stage" && stageEl){
    if(tour){ TT=clampT(TT+dt*1.1); if(TT>=1911){tour=false;syncTour();} }
    T+= (TT-T)*Math.min(1,dt*5.5); if(Math.abs(TT-T)<.002) T=TT;
    worldEl.style.transform=`translate3d(${-(T-YMIN)*ppy}px,0,0)`;
    // focus = nearest peak
    let best=null,bd=1e9;
    COMP.forEach(c=>{const d=Math.abs(T-c.peak); if(d<bd){bd=d;best=c}});
    COMP.forEach(c=>{
      const d=Math.abs(T-c.peak), n=nodeEls[c.slug];
      const s=1+.42*Math.exp(-((d/6)*(d/6))); n.style.setProperty("--s",s.toFixed(3)); n.style.setProperty("--ls",(1+.15*Math.exp(-((d/6)*(d/6)))).toFixed(3));
    });
    if(best.slug!==lastFocus){
      lastFocus=best.slug; focus=best.slug;
      COMP.forEach(c=>nodeEls[c.slug].classList.toggle("focus",c.slug===focus));
      stageEl.querySelectorAll(".edge").forEach(p=>p.classList.toggle("hot",p.dataset.a===focus||p.dataset.b===focus));
      setHUD(best);
      document.querySelectorAll(".scrub .tick").forEach(t=>t.classList.toggle("on",t.dataset.slug===focus));
    }
    // palette + backdrops
    const bl=eraBlend(T), key=Object.values(bl).map(v=>v.toFixed(2)).join();
    if(key!==lastPal){ lastPal=key; const p=palFor(bl);
      for(const k in p){ stageEl.style.setProperty(k,p[k]); $("#bar").style.setProperty(k,p[k]); }
      stageEl.querySelectorAll(".bgs img").forEach(i=>i.style.opacity=(bl[i.dataset.e]*.26).toFixed(3));
    }
    const head=$("#head"); if(head){ head.style.left=((T-YMIN)/(YMAX-YMIN)*100)+"%"; $("#headY").textContent=Math.round(T); }
    audioTick+=dt; if(audioTick>.1){ audioTick=0; A.drive(weightsAt(T)); A.lvl+=(A.level()-A.lvl)*.5; stageEl.style.setProperty("--lvl",A.lvl.toFixed(3)); }
  } else if(view==="page"||view==="game"){
    audioTick+=dt; if(audioTick>.1){ audioTick=0; A.drive(pageWeights); }
  }
  requestAnimationFrame(frame);
}
function syncTour(){ const b=$("#tourBtn"); if(b){ b.classList.toggle("on",tour); b.querySelector(".t").textContent=tour?"Stop tour":"Auto tour"; } }

/* ================= composer page ================= */
function spanChart(c){
  const lo=1670,hi=1920,W=900,x0=20,x1=880,rowH=17,top=34;
  const sx=y=>x0+(y-lo)/(hi-lo)*(x1-x0), H=top+COMP.length*rowH+24;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lifespans of all eighteen composers, highlighting ${esc(c.complete_name)}">`;
  for(let y=1700;y<=1900;y+=50) s+=`<line class="axis" x1="${sx(y)}" x2="${sx(y)}" y1="${top-10}" y2="${H-18}"/><text x="${sx(y)}" y="${top-16}" text-anchor="middle">${y}</text>`;
  [...COMP].sort((a,b)=>a.birth<b.birth?-1:1).forEach((o,i)=>{
    const y=top+i*rowH,a=sx(+yr(o.birth)),b=sx(+yr(o.death)),me=o.slug===c.slug,right=b>W-130;
    s+=`<a href="#${o.slug}"><rect class="${me?"bar-me":"bar-o"}" x="${a}" y="${y}" width="${b-a}" height="${rowH-6}" rx="2"/><text class="${me?"me":""}" x="${right?a-6:b+6}" y="${y+rowH-8}" text-anchor="${right?"end":"start"}">${esc(o.name)}</text></a>`;
  });
  return s+`</svg>`;
}
function pageHTML(slug,pick){
  const c=bySlug[slug],e=eraOf(c.era),a=c.art,sw=c.works[c.start];
  const i=ORDER.indexOf(slug),prev=COMP[i-1],next=COMP[i+1];
  const conns=EDGES.filter(x=>x[0]===slug||x[1]===slug).map(x=>{const o=bySlug[x[0]===slug?x[1]:x[0]];return `<a href="#${o.slug}"><img src="${o.portrait_data}" alt=""><div><b>${esc(o.complete_name)}</b><span>${esc(x[2])}</span></div></a>`});
  const works=c.works.map((w,k)=>`<div class="work${k===pick?" pick":""}" id="w${k}"><div><div class="tags"><span class="chip">${esc(w.genre)}</span>${k===c.start?'<span class="chip hot">Start here</span>':''}</div><h3>${esc(w.title)}</h3>${w.sub?`<p class="sub">${esc(w.sub)}</p>`:""}</div><a class="play" href="${yt(c,w)}" target="_blank" rel="noopener">${playIcon} Full recording on YouTube</a></div>`).join("");
  return `<div class="page e-${c.era}"><div class="wrap">
    <div class="p-head"><div class="p-portrait"><img src="${c.portrait_data}" alt="Portrait of ${esc(c.complete_name)}"></div>
      <div><span class="label">${e.name} era &middot; ${e.years}</span><h1>${esc(c.complete_name)}</h1>
        <div class="dates">${yr(c.birth)} &ndash; ${yr(c.death)} &middot; ${esc(c.place)}</div><p class="tagl">${esc(c.tag)}</p>
        <div class="chips">${slug==="beethoven"?'<span class="chip hot">Bridge to the Romantic</span>':''}<span class="chip">${esc(c.epoch)}</span><span class="chip">${+yr(c.death)-+yr(c.birth)} years</span></div>
        <p class="label" style="margin-top:22px;color:var(--accent)">&#9835; Now playing: ${esc(c.clip.piece)}</p></div></div>
    <div class="p-grid"><div class="p-main">
      <section><h2>Life</h2>${c.bio.map(p=>`<p>${esc(p)}</p>`).join("")}</section>
      <section><h2>Sound and style</h2><p class="style">${esc(c.style)}</p></section>
      <section class="listen"><h2>Listen for</h2><ul>${c.listen.map(l=>`<li><i></i><span>${esc(l)}</span></li>`).join("")}</ul></section>
      <section class="startbox"><span class="label" style="color:var(--accent)">Your first listen</span><h3 style="font-size:1.7rem;font-style:italic;margin-top:6px">${esc(sw.title)}</h3><p>${esc(c.startNote)}</p><a class="play" href="${yt(c,sw)}" target="_blank" rel="noopener">${playIcon} Listen on YouTube</a></section>
      ${conns.length?`<section><h2>Connections</h2><div class="conn">${conns.join("")}</div></section>`:""}
      <section class="fact"><span class="label">Good to know</span><p>${esc(c.fact)}</p></section>
    </div>
    <aside class="art-panel"><div class="mat"><img src="${a.img}" alt="${esc(a.title)} by ${esc(a.artist_title)}"></div>
      <span class="label" style="display:block;margin-top:18px">The painting that matches</span><h3>${esc(a.title)}</h3>
      <p class="cap">${esc(a.artist_title)}, ${esc(a.date_display)}${a.medium_display?`. ${esc(a.medium_display)}`:""}${a.place_of_origin?`. ${esc(a.place_of_origin)}`:""}</p>
      <p class="why">${esc(c.artWhy)}</p>
      <a class="src" href="https://www.artic.edu/artworks/${a.id}" target="_blank" rel="noopener">Art Institute of Chicago &middot; Public domain &nearr;</a></aside></div></div>
    <div class="works"><div class="wrap"><h2>Works to hear</h2><p class="label" style="margin-bottom:6px">Recommended by Open Opus. Each button opens a YouTube search.</p>${works}</div></div>
    <div class="wrap span"><h2>Where ${esc(c.name)} sits in time</h2><div class="span-scroll">${spanChart(c)}</div></div>
    <nav class="pn" aria-label="Neighboring composers">${prev?`<a href="#${prev.slug}"><span class="label">&larr; Earlier</span><b>${esc(prev.name)}</b></a>`:`<a href="#"><span class="label">&larr; Back</span><b>The constellation</b></a>`}${next?`<a href="#${next.slug}"><span class="label">Later &rarr;</span><b>${esc(next.name)}</b></a>`:`<a href="#"><span class="label">Finished &rarr;</span><b>The constellation</b></a>`}</nav></div>`;
}

/* ================= match the painting ================= */
let G=null, pageWeights={};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function startGame(){
  G={round:0,score:0,rounds:shuffle(COMP).slice(0,8),answered:false,hint:false};
  nextRound();
}
function nextRound(){
  if(G.round>=G.rounds.length) return endGame();
  const right=G.rounds[G.round];
  const same=shuffle(COMP.filter(c=>c.era===right.era&&c!==right)).slice(0,1);
  const others=shuffle(COMP.filter(c=>c!==right&&!same.includes(c))).slice(0,3-same.length);
  G.right=right; G.opts=shuffle([right,...same,...others]); G.answered=false; G.hint=false; pageWeights={};
  drawGame();
}
function drawGame(extra=""){
  const r=G.right,a=r.art;
  const opts=G.opts.map(o=>{
    const cls=G.answered?(o===r?"right":(o.picked?"wrong":"dim")):(G.hint&&o.era!==r.era?"dim":"");
    return `<div class="opt ${cls}" data-slug="${o.slug}"><button class="opt-pick" style="all:unset;display:contents;cursor:pointer" ${G.answered?"disabled":""} data-pick="${o.slug}"><img src="${o.portrait_data}" alt=""><span><b>${esc(o.name)}</b><small>${yr(o.birth)}&ndash;${yr(o.death)}</small></span></button><button class="hear" data-hear="${o.slug}" aria-label="Hear ${esc(o.name)}">${playIcon}</button></div>`;
  }).join("");
  const reveal=G.answered?`<div class="reveal"><span class="label" style="color:var(--accent)">${G.last?"Correct":"Not quite"}: this is ${esc(a.title)} and it belongs with ${esc(r.complete_name)}</span><p>${esc(r.artWhy)}</p><div class="row"><button class="btn solid" id="gNext">${G.round+1>=G.rounds.length?"See my score":"Next painting"}</button><a class="btn" href="#${r.slug}">Visit ${esc(r.name)}</a></div></div>`:"";
  $("#ov").innerHTML=`<div class="game e-${G.answered?r.era:"classical"}">
    <span class="label">Match the painting</span><h1>Whose music is this?</h1>
    <div class="g-top"><span class="label">Painting ${G.round+1} of ${G.rounds.length}</span><span class="label">Score ${G.score}</span></div>
    <figure class="g-art"><img src="${a.img}" alt="A painting to match"></figure>
    ${G.answered?`<p class="label" style="margin-top:10px">${esc(a.title)}, ${esc(a.artist_title)}, ${esc(a.date_display)}</p>`:`<p class="label" style="margin-top:10px">Title and artist are hidden. Use the play buttons to hear each composer.</p>`}
    <div class="g-q">Which composer shares its spirit?</div><div class="opts">${opts}</div>
    ${G.answered?"":`<p style="margin-top:14px"><button class="btn" id="gHint" ${G.hint?"disabled":""}>Hint: reveal the era (${esc(eraOf(r.era).name)})</button></p>`}
    ${reveal}</div>`;
  const ovEl=$("#ov"); ovEl.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    if(G.answered) return; const o=bySlug[b.dataset.pick]; G.answered=true; o.picked=true; G.last=o===r;
    if(G.last) G.score+= G.hint?1:2; COMP.forEach(c=>{ if(c!==o) c.picked=false; }); pageWeights={}; drawGame(); ovEl.scrollTo({top:ovEl.scrollHeight,behavior:"smooth"});
  });
  ovEl.querySelectorAll("[data-hear]").forEach(b=>b.onclick=()=>{ ensureAudio(); pageWeights={[b.dataset.hear]:1}; });
  const n=$("#gNext"); if(n) n.onclick=()=>{G.round++;COMP.forEach(c=>c.picked=false);nextRound();ovEl.scrollTo({top:0})};
  const h=$("#gHint"); if(h) h.onclick=()=>{G.hint=true;drawGame()};
}
function endGame(){
  const max=G.rounds.length*2, s=G.score, rank=s>=max*.85?"Maestro":s>=max*.6?"Concertmaster":s>=max*.35?"Orchestra member":"Eager listener";
  pageWeights={};
  $("#ov").innerHTML=`<div class="game e-romantic"><span class="label">Match the painting</span><h1>Final score</h1><div class="score" style="margin-top:20px">${s} / ${max}</div><p class="lede" style="font-size:1.4rem;color:var(--fg)">${rank}</p>
    <p class="lede">Two points for each right answer, one if you used the hint.</p><div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px"><button class="btn solid" id="again">Play again</button><a class="btn" href="#">Back to the constellation</a></div></div>`;
  $("#again").onclick=startGame;
}

/* ================= credits ================= */
function creditsHTML(){
  const AU=DATA.audio;
  return `<div class="credits e-baroque"><span class="label">Sources</span><h1>Credits</h1>
  <p>The Long Score uses composer data and portraits from <a href="https://openopus.org" target="_blank" rel="noopener">Open Opus</a> and paintings from the open-access collection of the <a href="https://www.artic.edu" target="_blank" rel="noopener">Art Institute of Chicago</a>. The background music is a short excerpt of each recording below, hosted on Wikimedia Commons.</p>
  <ul>${COMP.map(c=>{const m=AU[c.slug];return `<li><b>${esc(c.name)}</b>: ${esc(c.clip.piece)}${c.clip.by?`, ${esc(c.clip.by)}`:""}<br><span>${esc(m.lic||"")} &middot; <a href="${esc(m.page)}" target="_blank" rel="noopener">Recording page</a></span></li>`}).join("")}</ul>
  <p><a class="btn" href="#">Back to the constellation</a></p></div>`;
}

/* ================= routing + chrome ================= */
function ensureAudio(){ if(A.init()){ A.resume(); } }
function setBar(mode,era){
  const b=$("#bar");
  if(mode==="stage"){
    b.className="bar";
    b.innerHTML=`<a class="brand" href="#">The Long Score</a><div class="tools"><button class="tbtn" id="tourBtn" type="button">${playIcon}<span class="t">Auto tour</span></button><a class="tbtn" href="#match">Match the painting</a><a class="tbtn" href="#credits"><span class="t">Credits</span><span aria-hidden="true">&copy;</span></a><button class="tbtn" id="muteBtn" type="button" aria-label="Sound"></button></div>`;
    $("#tourBtn").onclick=()=>{ tour=!tour; if(tour&&TT>1905) TT=1700; syncTour(); hideHint(); };
  } else {
    b.removeAttribute("style"); b.className="bar e-"+(era||"baroque");
    b.innerHTML=`<a class="brand" href="#">The Long Score</a><div class="tools"><a class="tbtn" href="#">&larr; <span class="t">Constellation</span></a><button class="tbtn" id="muteBtn" type="button" aria-label="Sound"></button></div>`;
  }
  const mb=$("#muteBtn"); const upd=()=>{ mb.innerHTML=spk(A.on&&!A.muted)+`<span class="t">${A.on&&!A.muted?"Sound on":"Sound off"}</span>`; document.body.classList.toggle("muted-state",!(A.on&&!A.muted)); };
  mb.onclick=()=>{ if(!A.on){ ensureAudio(); A.setMuted(false);} else A.setMuted(!A.muted); upd(); }; upd();
}
function route(){
  const raw=location.hash.replace(/^#/,""); const [slug,pick]=raw.split(".");
  const ov=$("#ov");
  if(bySlug[slug]){
    const c=bySlug[slug]; view="page"; pageWeights={[slug]:1};
    ov.className="ov e-"+c.era; ov.hidden=false; ov.innerHTML=pageHTML(slug,pick!==undefined?+pick:-1); setBar("page",c.era); ov.scrollTo({top:0});
    if(pick!==undefined){ const t=document.getElementById("w"+pick); if(t) setTimeout(()=>t.scrollIntoView({block:"center"}),40); }
    return;
  }
  if(raw==="match"){ view="game"; pageWeights={}; ov.className="ov e-classical"; ov.hidden=false; setBar("page","classical"); startGame(); ov.scrollTo({top:0}); return; }
  if(raw==="credits"){ view="credits"; pageWeights={}; ov.className="ov e-baroque"; ov.hidden=false; ov.innerHTML=creditsHTML(); setBar("page","baroque"); ov.scrollTo({top:0}); return; }
  // constellation
  view="stage"; ov.hidden=true; ov.innerHTML=""; setBar("stage"); lastPal=""; lastFocus="";
}
function keys(e){
  if(view!=="stage"||!$("#gate").hidden) return;
  if(e.key==="ArrowRight"){ TT=clampT(TT+3); tour=false; syncTour(); hideHint(); }
  else if(e.key==="ArrowLeft"){ TT=clampT(TT-3); tour=false; syncTour(); hideHint(); }
  else if(e.key==="Enter"&&focus&&document.activeElement.tagName!=="A"&&document.activeElement.tagName!=="BUTTON"){ location.hash=focus; }
}
addEventListener("keydown",keys);
addEventListener("hashchange",route);
addEventListener("resize",()=>{ if(view==="stage"&&$("#gate").hidden){ const t=TT; buildStage(); lastFocus=""; } });
document.addEventListener("visibilitychange",()=>{ if(A.ctx){ document.hidden?A.ctx.suspend():A.resume(); } });

buildStage(); route(); requestAnimationFrame(frame);
function enter(sound){
  $("#gate").hidden=true;
  if(sound){ ensureAudio(); A.setMuted(false); }
  const mb=$("#muteBtn"); if(mb){ mb.innerHTML=spk(A.on&&!A.muted)+`<span class="t">${A.on&&!A.muted?"Sound on":"Sound off"}</span>`; document.body.classList.toggle("muted-state",!(A.on&&!A.muted)); }
  if(sound && view==="stage"){ A.load("vivaldi"); }
  setTimeout(hideHint,9000);
}
$("#enterSound").onclick=()=>enter(true);
$("#enterQuiet").onclick=()=>enter(false);
if(location.hash.length>1) { /* deep link: still show the gate so sound can start from a click */ }
</script>
